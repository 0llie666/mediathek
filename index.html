<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0llie666 - YouTube Gallery Widget</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter & Rajdhani) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: {
                            red: '#FF0000',
                            dark: '#0f1117',
                            card: '#161922',
                            border: '#262a36',
                            accent: '#ff0055',
                            neon: '#00f0ff'
                        }
                    },
                    fontFamily: {
                        gaming: ['Rajdhani', 'sans-serif'],
                        body: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0c10;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(22, 25, 34, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.35);
        }
        .glow-red:hover {
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
        }
        .card-hover-effect {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover-effect:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 0, 85, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 0, 85, 0.2);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #262a36;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff0055;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center justify-start">

    <!-- Widget Container -->
    <div class="w-full max-w-7xl mx-auto space-y-6">

        <!-- Top Header & Admin Bar Toggle -->
        <div class="flex justify-between items-center text-xs text-gray-400 px-2">
            <span class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                YouTube Gallery Widget Live
            </span>
            <button id="toggleSettingsBtn" class="hover:text-white transition flex items-center gap-1.5 bg-yt-card px-3 py-1.5 rounded-lg border border-yt-border">
                <i class="fa-solid fa-gear text-yt-accent"></i> API / JSON Einstellungen
            </button>
        </div>

        <!-- Admin / Configuration Collapsible Panel -->
        <div id="settingsPanel" class="hidden glass-panel rounded-2xl p-5 border border-yt-accent/30 space-y-4 animate-fade-in">
            <div class="flex justify-between items-center border-b border-yt-border pb-3">
                <h3 class="font-gaming font-bold text-lg text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-yt-accent"></i> Widget Konfiguration
                </h3>
                <span class="text-xs text-gray-400">Speichert Einstellungen im Browser (LocalStorage)</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <!-- Mode Switch -->
                <div class="space-y-2">
                    <label class="block text-gray-300 font-medium">Datenquelle wählen</label>
                    <div class="flex gap-3">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="feedMode" value="preset" checked class="peer hidden" id="modePreset">
                            <div class="p-3 rounded-xl border border-yt-border bg-yt-dark peer-checked:border-yt-accent peer-checked:bg-yt-accent/10 text-center transition">
                                <i class="fa-solid fa-list-ul mb-1 block text-lg"></i> Custom / Demo Modus
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="feedMode" value="api" class="peer hidden" id="modeApi">
                            <div class="p-3 rounded-xl border border-yt-border bg-yt-dark peer-checked:border-yt-accent peer-checked:bg-yt-accent/10 text-center transition">
                                <i class="fa-brands fa-youtube mb-1 block text-lg"></i> YouTube API v3
                            </div>
                        </label>
                    </div>
                </div>

                <!-- API Key Inputs -->
                <div id="apiConfigContainer" class="space-y-3 opacity-50 pointer-events-none transition-all">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">YouTube Data API Key</label>
                        <input type="text" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-yt-dark border border-yt-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yt-accent text-xs">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Channel ID (z.B. UC...)</label>
                        <input type="text" id="channelIdInput" placeholder="UCxxxxxxxxxxxx" class="w-full bg-yt-dark border border-yt-border rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yt-accent text-xs">
                    </div>
                </div>
            </div>

            <!-- Custom JSON Input -->
            <div id="jsonConfigContainer" class="space-y-2">
                <label class="block text-xs text-gray-400">Eigene Videos (JSON Formate)</label>
                <textarea id="jsonVideoInput" rows="4" class="w-full bg-yt-dark border border-yt-border rounded-lg p-2.5 text-xs font-mono text-gray-300 focus:outline-none focus:border-yt-accent"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <button id="resetDataBtn" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 transition">Standard Wiederherstellen</button>
                <button id="saveConfigBtn" class="px-5 py-2 rounded-lg bg-yt-accent hover:bg-rose-600 text-xs font-bold text-white transition glow-red">Speichern & Aktualisieren</button>
            </div>
        </div>

        <!-- MAIN CHANNEL HEADER -->
        <div class="glass-panel rounded-3xl p-6 md:p-8 relative overflow-hidden shadow-2xl border border-yt-border">
            <!-- Background Decorative Glow -->
            <div class="absolute -right-16 -top-16 w-64 h-64 bg-yt-accent/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -left-16 -bottom-16 w-64 h-64 bg-yt-neon/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                <!-- Avatar & Info -->
                <div class="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
                    <div class="relative group">
                        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden border-2 border-yt-accent/80 p-1 bg-yt-dark shadow-xl">
                            <img id="channelAvatar" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=300&auto=format&fit=crop&q=80" alt="0llie666 Avatar" class="w-full h-full object-cover rounded-xl group-hover:scale-105 transition duration-300">
                        </div>
                        <span class="absolute -bottom-2 -right-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full border-2 border-yt-dark flex items-center gap-1">
                            <i class="fa-brands fa-youtube"></i> LIVE
                        </span>
                    </div>

                    <div class="space-y-1">
                        <div class="flex items-center justify-center sm:justify-start gap-2">
                            <h1 class="text-3xl sm:text-4xl font-gaming font-extrabold tracking-wider text-white">0llie666</h1>
                            <i class="fa-solid fa-circle-check text-yt-accent text-lg" title="Verifizierter Creator"></i>
                        </div>
                        <p class="text-sm text-gray-400 font-medium">@ollie6662</p>
                        <div class="flex items-center justify-center sm:justify-start gap-4 text-xs text-gray-300 pt-2">
                            <span class="flex items-center gap-1.5 bg-yt-dark/60 px-3 py-1 rounded-full border border-yt-border">
                                <i class="fa-solid fa-users text-yt-accent"></i> <strong id="subCount">14.8K</strong> Abonnenten
                            </span>
                            <span class="flex items-center gap-1.5 bg-yt-dark/60 px-3 py-1 rounded-full border border-yt-border">
                                <i class="fa-solid fa-video text-yt-neon"></i> <strong id="videoCount">120+</strong> Videos
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Call to Action Subscribe Button -->
                <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
                    <a href="https://www.youtube.com/@ollie6662?sub_confirmation=1" target="_blank" rel="noopener font-bold" class="w-full sm:w-auto px-7 py-3.5 bg-gradient-to-r from-red-600 to-yt-accent hover:from-red-500 hover:to-rose-500 text-white font-gaming text-lg tracking-wider rounded-xl font-bold flex items-center justify-center gap-3 shadow-lg glow-red transition duration-300 transform active:scale-95">
                        <i class="fa-brands fa-youtube text-xl"></i>
                        ABONNIEREN
                    </a>
                </div>
            </div>

            <!-- Category Navigation Tabs -->
            <div class="mt-8 pt-6 border-t border-yt-border/60 flex items-center justify-between gap-4 overflow-x-auto pb-2 scrollbar-none">
                <div class="flex items-center gap-2" id="filterTabs">
                    <button data-filter="all" class="tab-btn active px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-yt-accent text-white shadow-lg">
                        <i class="fa-solid fa-fire mr-1.5"></i> Alle Videos
                    </button>
                    <button data-filter="latest" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-yt-dark text-gray-400 hover:text-white border border-yt-border">
                        <i class="fa-solid fa-clock mr-1.5"></i> Neueste
                    </button>
                    <button data-filter="popular" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-yt-dark text-gray-400 hover:text-white border border-yt-border">
                        <i class="fa-solid fa-trophy mr-1.5"></i> Beliebt
                    </button>
                    <button data-filter="shorts" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-yt-dark text-gray-400 hover:text-white border border-yt-border">
                        <i class="fa-solid fa-bolt mr-1.5"></i> Highlights / Shorts
                    </button>
                </div>

                <div class="text-xs text-gray-500 hidden lg:block whitespace-nowrap">
                    Klicke auf ein Video zum Abspielen
                </div>
            </div>
        </div>

        <!-- VIDEO GRID SECTION -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Dynamic Video Cards will be injected here -->
        </div>

        <!-- Empty State Message -->
        <div id="emptyState" class="hidden glass-panel rounded-2xl p-12 text-center text-gray-400 my-8">
            <i class="fa-solid fa-film text-4xl mb-3 text-yt-accent"></i>
            <p class="text-lg font-semibold">Keine Videos in dieser Kategorie gefunden.</p>
        </div>

    </div>

    <!-- LIGHTBOX MODAL PLAYER -->
    <div id="videoModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4 transition-opacity duration-300">
        <div class="relative w-full max-w-5xl bg-yt-card border border-yt-border rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-yt-border bg-yt-dark">
                <div class="flex items-center gap-3 overflow-hidden pr-4">
                    <span class="w-3 h-3 rounded-full bg-yt-accent animate-ping"></span>
                    <h3 id="modalVideoTitle" class="font-bold text-sm sm:text-base text-white truncate">Video Title</h3>
                </div>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white w-9 h-9 rounded-full bg-yt-card flex items-center justify-center border border-yt-border transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Video Player Iframe Container (16:9 Aspect Ratio) -->
            <div class="relative w-full aspect-video bg-black">
                <iframe id="modalIframe" class="w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- Modal Footer Info -->
            <div class="p-5 flex flex-wrap items-center justify-between gap-4 bg-yt-dark/80 text-xs text-gray-400 border-t border-yt-border">
                <div class="flex items-center gap-4">
                    <span id="modalViews"><i class="fa-solid fa-eye mr-1 text-yt-neon"></i> 0 Aufrufe</span>
                    <span id="modalDate"><i class="fa-solid fa-calendar mr-1 text-yt-accent"></i> -</span>
                </div>
                <a id="modalYtLink" href="#" target="_blank" class="px-4 py-2 bg-yt-card border border-yt-border hover:border-yt-accent rounded-lg text-white font-medium flex items-center gap-2 transition">
                    Auf YouTube ansehen <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Default Sample Videos for @ollie6662
        const DEFAULT_VIDEOS = [
            {
                id: "M7lc1UVf-VE",
                title: "EPISCHER GAMING MOMENT! 💥 Best Highlights 0llie666",
                category: "popular",
                duration: "14:20",
                views: "42.5K",
                date: "Vor 2 Tagen",
                thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "dQw4w9WgXcQ",
                title: "NEUES UPDATE REAKTION! 🔥 Das muss jeder wissen!",
                category: "latest",
                duration: "08:45",
                views: "12.8K",
                date: "Vor 5 Tagen",
                thumbnail: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "L_LUpnjgPso",
                title: "CLUTCH WIN IN DER LETZTEN SEKUNDE! 🏆",
                category: "shorts",
                duration: "00:58",
                views: "89.1K",
                date: "Vor 1 Woche",
                thumbnail: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "kJQP7kiw5Fk",
                title: "Mein Ultimatives Gaming Setup Tour 2026 🖥️",
                category: "popular",
                duration: "18:10",
                views: "105K",
                date: "Vor 2 Wochen",
                thumbnail: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "fJ9rUzIMcZQ",
                title: "Pro Tips & Tricks die du sofort nutzen solltest!",
                category: "latest",
                duration: "11:30",
                views: "8.4K",
                date: "Vor 3 Wochen",
                thumbnail: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80"
            },
            {
                id: "3JZ_D3ELwOQ",
                title: "Unfassbarer Bug / Glitch entdeckt! 😱",
                category: "shorts",
                duration: "00:45",
                views: "34.2K",
                date: "Vor 1 Monat",
                thumbnail: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&auto=format&fit=crop&q=80"
            }
        ];

        // State Management
        let videoData = [...DEFAULT_VIDEOS];
        let currentFilter = 'all';

        // DOM Elements
        const videoGrid = document.getElementById('videoGrid');
        const emptyState = document.getElementById('emptyState');
        const videoModal = document.getElementById('videoModal');
        const modalIframe = document.getElementById('modalIframe');
        const modalVideoTitle = document.getElementById('modalVideoTitle');
        const modalViews = document.getElementById('modalViews');
        const modalDate = document.getElementById('modalDate');
        const modalYtLink = document.getElementById('modalYtLink');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Settings Panel Elements
        const toggleSettingsBtn = document.getElementById('toggleSettingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const modePreset = document.getElementById('modePreset');
        const modeApi = document.getElementById('modeApi');
        const apiConfigContainer = document.getElementById('apiConfigContainer');
        const jsonConfigContainer = document.getElementById('jsonConfigContainer');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const channelIdInput = document.getElementById('channelIdInput');
        const jsonVideoInput = document.getElementById('jsonVideoInput');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const resetDataBtn = document.getElementById('resetDataBtn');

        // Initialize App
        function init() {
            loadSavedConfig();
            renderVideos();
            setupEventListeners();
        }

        // Render Video Cards
        function renderVideos() {
            videoGrid.innerHTML = '';

            const filteredVideos = currentFilter === 'all' 
                ? videoData 
                : videoData.filter(v => v.category === currentFilter);

            if (filteredVideos.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filteredVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = "bg-yt-card border border-yt-border rounded-2xl overflow-hidden card-hover-effect cursor-pointer group flex flex-col";
                card.onclick = () => openModal(video);

                card.innerHTML = `
                    <div class="relative aspect-video w-full overflow-hidden bg-yt-dark">
                        <img src="${video.thumbnail}" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <div class="w-14 h-14 rounded-full bg-yt-accent/90 text-white flex items-center justify-center shadow-lg transform scale-75 group-hover:scale-100 transition duration-300">
                                <i class="fa-solid fa-play text-xl ml-1"></i>
                            </div>
                        </div>
                        <span class="absolute bottom-2 right-2 bg-black/80 backdrop-blur-md text-white text-[11px] font-semibold px-2 py-0.5 rounded">
                            ${video.duration}
                        </span>
                    </div>

                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <h4 class="font-bold text-sm text-gray-100 group-hover:text-yt-accent transition line-clamp-2 leading-snug">
                            ${video.title}
                        </h4>
                        
                        <div class="flex items-center justify-between text-xs text-gray-400 pt-2 border-t border-yt-border/50">
                            <span class="flex items-center gap-1">
                                <i class="fa-solid fa-eye text-gray-500"></i> ${video.views}
                            </span>
                            <span>${video.date}</span>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
        }

        // Lightbox Modal Handlers
        function openModal(video) {
            modalVideoTitle.textContent = video.title;
            modalViews.innerHTML = `<i class="fa-solid fa-eye mr-1 text-yt-neon"></i> ${video.views} Aufrufe`;
            modalDate.innerHTML = `<i class="fa-solid fa-calendar mr-1 text-yt-accent"></i> ${video.date}`;
            modalYtLink.href = `https://www.youtube.com/watch?v=${video.id}`;
            
            // Set autoplay YouTube iframe embed link
            modalIframe.src = `https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0`;

            videoModal.classList.remove('hidden');
            videoModal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            videoModal.classList.add('hidden');
            videoModal.classList.remove('flex');
            modalIframe.src = ""; // Stop playback
            document.body.style.overflow = '';
        }

        // Event Listeners
        function setupEventListeners() {
            // Category Filter Tabs
            document.getElementById('filterTabs').addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (!btn) return;

                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('bg-yt-accent', 'text-white', 'shadow-lg');
                    b.classList.add('bg-yt-dark', 'text-gray-400', 'border', 'border-yt-border');
                });

                btn.classList.remove('bg-yt-dark', 'text-gray-400', 'border', 'border-yt-border');
                btn.classList.add('bg-yt-accent', 'text-white', 'shadow-lg');

                currentFilter = btn.dataset.filter;
                renderVideos();
            });

            // Modal Close Events
            closeModalBtn.addEventListener('click', closeModal);
            videoModal.addEventListener('click', (e) => {
                if (e.target === videoModal) closeModal();
            });

            // ESC key to close modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            // Toggle Settings Drawer
            toggleSettingsBtn.addEventListener('click', () => {
                settingsPanel.classList.toggle('hidden');
            });

            // Switch Radio Feed Mode
            document.querySelectorAll('input[name="feedMode"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'api') {
                        apiConfigContainer.classList.remove('opacity-50', 'pointer-events-none');
                        jsonConfigContainer.classList.add('opacity-50', 'pointer-events-none');
                    } else {
                        apiConfigContainer.classList.add('opacity-50', 'pointer-events-none');
                        jsonConfigContainer.classList.remove('opacity-50', 'pointer-events-none');
                    }
                });
            });

            // Save Configuration
            saveConfigBtn.addEventListener('click', () => {
                const isApi = modeApi.checked;
                if (isApi) {
                    const apiKey = apiKeyInput.value.trim();
                    const channelId = channelIdInput.value.trim();
                    if (!apiKey || !channelId) {
                        alert("Bitte gib sowohl API Key als auch Channel ID ein.");
                        return;
                    }
                    fetchYouTubeApi(apiKey, channelId);
                } else {
                    try {
                        const customJson = JSON.parse(jsonVideoInput.value);
                        videoData = customJson;
                        localStorage.setItem('yt_custom_videos', JSON.stringify(customJson));
                        renderVideos();
                        alert("Eigene Videoliste erfolgreich gespeichert!");
                    } catch (err) {
                        alert("Ungültiges JSON-Format! Bitte überprüfe deine Eingabe.");
                    }
                }
            });

            // Reset Config Button
            resetDataBtn.addEventListener('click', () => {
                videoData = [...DEFAULT_VIDEOS];
                localStorage.removeItem('yt_custom_videos');
                jsonVideoInput.value = JSON.stringify(DEFAULT_VIDEOS, null, 2);
                renderVideos();
                alert("Auf Standard-Demodaten zurückgesetzt.");
            });
        }

        // Load Stored Local Configuration
        function loadSavedConfig() {
            const savedVideos = localStorage.getItem('yt_custom_videos');
            if (savedVideos) {
                try {
                    videoData = JSON.parse(savedVideos);
                } catch (e) {
                    videoData = [...DEFAULT_VIDEOS];
                }
            }
            jsonVideoInput.value = JSON.stringify(videoData, null, 2);
        }

        // YouTube API Fetch Implementation
        async function fetchYouTubeApi(apiKey, channelId) {
            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${apiKey}&channelId=${channelId}&part=snippet,id&order=date&maxResults=12&type=video`);
                const data = await response.json();
                
                if (data.error) {
                    alert("YouTube API Fehler: " + data.error.message);
                    return;
                }

                videoData = data.items.map(item => ({
                    id: item.id.videoId,
                    title: item.snippet.title,
                    category: 'latest',
                    duration: 'HD',
                    views: 'Live API',
                    date: new Date(item.snippet.publishedAt).toLocaleDateString("de-DE"),
                    thumbnail: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.medium.url
                }));

                renderVideos();
                alert(`Erfolgreich ${videoData.length} Videos aus der YouTube API geladen!`);
            } catch (error) {
                alert("Fehler beim Abrufen der Daten: " + error.message);
            }
        }

        // Run App
        window.onload = init;
    </script>
</body>
</html>

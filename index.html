<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0llie666 YouTube Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            color: #f3f4f6;
        }
        .font-gaming {
            font-family: 'Rajdhani', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 p-4 sm:p-6 min-h-screen">

    <div class="max-w-6xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
        <!-- Header -->
        <div class="bg-gradient-to-r from-purple-900/50 via-slate-900 to-indigo-950 p-6 border-b border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-600 to-pink-500 p-1 flex items-center justify-center shadow-lg shadow-purple-500/20">
                        <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-purple-400 font-bold text-xl font-gaming">06</div>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-slate-900 rounded-full"></span>
                </div>
                <div>
                    <h1 class="font-gaming text-2xl font-bold tracking-wide text-white flex items-center gap-2">
                        0llie666 <span class="text-xs bg-purple-600/30 text-purple-400 border border-purple-500/30 px-2 py-0.5 rounded-full font-sans font-normal">YouTube Feed</span>
                    </h1>
                    <p class="text-xs text-slate-400">Retro Gaming, LAN-Partys & Live Stream VODs</p>
                </div>
            </div>
            <a href="https://www.youtube.com/@ollie6662?sub_confirmation=1" target="_blank" class="bg-red-600 hover:bg-red-700 text-white font-gaming text-lg px-5 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition-all flex items-center gap-2">
                <i class="fab fa-youtube text-xl"></i> Abonnieren
            </a>
        </div>

        <!-- Video Grid Container -->
        <div class="p-6">
            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Videos werden hier dynamisch eingefügt -->
            </div>
        </div>
    </div>

    <!-- Video Modal -->
    <div id="video-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="relative w-full max-w-4xl bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center z-10 transition-colors">
                <i class="fas fa-times"></i>
            </button>
            <div class="relative pt-[56.25%] w-full bg-black">
                <iframe id="modal-iframe" class="absolute top-0 left-0 w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        // Standard-Videos von deinem Kanal als sicherer Fallback (werden überschrieben, wenn Feed lädt)
        const FALLBACK_VIDEOS = [
            { videoId: 'GOY6AXwcsW0', title: '0llie666 LAN Party X Penta Club e.V. - Day III', date: 'Neuestes Video' },
            { videoId: 'DF7qrqL_wSw', title: '0llie666 LAN Party - Official Trailer', date: 'Highlight' },
            { videoId: 'qvGH6nbx3IU', title: '0llie666 zu Gast bei Streamvibes #Podcast', date: 'Highlight' }
        ];

        const CHANNEL_ID = 'UCanLxec_3PUi9vaxXpk1wKw';

        async function fetchChannelVideos() {
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
            
            try {
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    const data = await response.json();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                    const entries = xmlDoc.getElementsByTagName("entry");

                    if (entries.length > 0) {
                        const list = [];
                        for (let i = 0; i < Math.min(entries.length, 6); i++) {
                            const entry = entries[i];
                            const videoId = entry.getElementsByTagName("yt:videoId")[0]?.textContent || '';
                            const title = entry.getElementsByTagName("title")[0]?.textContent || '';
                            const pubDate = entry.getElementsByTagName("published")[0]?.textContent || '';
                            const dateStr = pubDate ? new Date(pubDate).toLocaleDateString('de-DE') : '';
                            if (videoId) {
                                list.push({ videoId, title, date: dateStr });
                            }
                        }
                        if (list.length > 0) return list;
                    }
                }
            } catch (err) {
                console.log('Verwendung der integrierten Videos:', err);
            }
            return FALLBACK_VIDEOS;
        }

        async function renderVideos() {
            const grid = document.getElementById('video-grid');
            const videos = await fetchChannelVideos();

            grid.innerHTML = '';
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'group bg-slate-950 border border-slate-800 rounded-xl overflow-hidden hover:border-purple-500/50 transition-all duration-300 flex flex-col cursor-pointer shadow-md hover:shadow-purple-500/10';
                card.onclick = () => openModal(video.videoId);

                card.innerHTML = `
                    <div class="relative aspect-video bg-slate-900 overflow-hidden">
                        <img src="https://i.ytimg.com/vi/${video.videoId}/hqdefault.jpg" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <div class="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                <i class="fas fa-play ml-0.5"></i>
                            </div>
                        </div>
                        <span class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-0.5 rounded font-medium">HD</span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <h3 class="font-gaming text-lg font-semibold text-white group-hover:text-purple-400 transition-colors line-clamp-2">${video.title}</h3>
                        <div class="flex items-center justify-between text-xs text-slate-400 mt-3 pt-3 border-t border-slate-800">
                            <span><i class="far fa-calendar-alt mr-1"></i> ${video.date}</span>
                            <span class="text-purple-400 font-medium group-hover:underline">Abspielen <i class="fas fa-arrow-right ml-1"></i></span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(videoId) {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = '';
            modal.classList.add('hidden');
        }

        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') closeModal();
        });

        renderVideos();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Øllie666 YouTube Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121117 !important;
            color: #d1d5db;
        }
        .font-gaming {
            font-family: 'Rajdhani', sans-serif;
        }
    </style>
</head>
<body class="p-2 sm:p-4 min-h-screen" style="background-color: #121117;">

    <div class="max-w-7xl mx-auto flex flex-col min-h-screen justify-between">
        <div>
            <!-- Status / Loading Container -->
            <div id="loading" class="text-center py-16 text-slate-400">
                <i class="fas fa-circle-notch fa-spin text-4xl text-purple-500 mb-3"></i>
                <p class="font-medium text-slate-300">Lade Videos von Øllie666...</p>
            </div>

            <!-- Video Grid Container (3 Spalten x 10 Zeilen = 30 Videos) -->
            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- Videos werden hier dynamisch eingefügt -->
            </div>
        </div>

        <!-- Nummerierte Paginierungsleiste -->
        <div id="pagination-container" class="mt-8 pt-6 border-t border-slate-800/80 flex items-center justify-center gap-2 hidden flex-wrap">
            <!-- Dynamische Seitenzahlen werden hier per JS eingefügt -->
        </div>
    </div>

    <!-- Lightbox Video Modal -->
    <div id="video-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="relative w-full max-w-5xl bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700 w-10 h-10 rounded-full flex items-center justify-center z-20 transition-colors">
                <i class="fas fa-times text-lg"></i>
            </button>
            <div class="relative pt-[56.25%] w-full bg-black">
                <iframe id="modal-iframe" class="absolute top-0 left-0 w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyBbyyj_VFDsgjNK3pu2DAqsX1MHqhFsRps'; 
        // Die Upload-Playlist ID deines Kanals (leitet sich direkt aus UCanLxec... ab -> UUcanLxec...)
        const UPLOADS_PLAYLIST_ID = 'UUcanLxec_3PUi9vaxXpk1wKw'; 
        const RESULTS_PER_PAGE = 30; // 3 Spalten x 10 Zeilen

        let pageTokens = ['']; 
        let currentPageIndex = 0;
        let hasMorePages = true;

        async function fetchVideosForPage(pageIndex) {
            const grid = document.getElementById('video-grid');
            const loading = document.getElementById('loading');
            const pagination = document.getElementById('pagination-container');

            grid.classList.add('hidden');
            pagination.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                while (pageTokens.length <= pageIndex && hasMorePages) {
                    await fetchNextPageToken();
                }

                const pageToken = pageTokens[pageIndex] || '';
                
                // Nutzt playlistItems (kostet nur 1 Unit statt 100 bei search!)
                const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${UPLOADS_PLAYLIST_ID}&part=snippet,contentDetails&maxResults=${RESULTS_PER_PAGE}&pageToken=${pageToken}`;
                const res = await fetch(playlistUrl);
                const data = await res.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (!data.items || data.items.length === 0) {
                    throw new Error("Keine Videos gefunden.");
                }

                if (data.nextPageToken && !pageTokens.includes(data.nextPageToken)) {
                    if (pageTokens.length === pageIndex + 1) {
                        pageTokens.push(data.nextPageToken);
                    }
                } else if (!data.nextPageToken) {
                    hasMorePages = false;
                }

                // Sammle Video IDs für Statistiken (Aufrufe, Likes)
                const videoIds = data.items.map(item => item.contentDetails.videoId).join(',');

                const detailsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&id=${videoIds}&part=snippet,contentDetails,statistics`);
                const detailsData = await detailsRes.json();

                renderVideos(detailsData.items);

                currentPageIndex = pageIndex;
                renderPaginationControls();

                loading.classList.add('hidden');
                grid.classList.remove('hidden');
                pagination.classList.remove('hidden');

                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (err) {
                console.error("Fehler beim Laden der Seite:", err);
                loading.innerHTML = `
                    <div class="p-6 bg-slate-900 border border-red-500/30 rounded-xl text-center max-w-lg mx-auto text-red-400">
                        <i class="fas fa-exclamation-triangle text-3xl mb-3"></i>
                        <h3 class="text-white font-bold text-lg mb-1">Tageslimit erreicht oder Fehler</h3>
                        <p class="text-xs text-slate-400">${err.message}</p>
                        <p class="text-xs text-slate-500 mt-2">Das Kontingent wird täglich von Google zurückgesetzt.</p>
                    </div>`;
            }
        }

        async function fetchNextPageToken() {
            const lastToken = pageTokens[pageTokens.length - 1];
            const playlistUrl = `https://www.googleapis.com/youtube/v3/playlistItems?key=${API_KEY}&playlistId=${UPLOADS_PLAYLIST_ID}&part=id&maxResults=${RESULTS_PER_PAGE}&pageToken=${lastToken}`;
            const res = await fetch(playlistUrl);
            const data = await res.json();
            if (data.nextPageToken) {
                pageTokens.push(data.nextPageToken);
            } else {
                hasMorePages = false;
            }
        }

        function renderPaginationControls() {
            const container = document.getElementById('pagination-container');
            container.innerHTML = '';

            const totalKnownPages = pageTokens.length + (hasMorePages ? 1 : 0);

            const prevBtn = document.createElement('button');
            prevBtn.className = `w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-center transition-all ${currentPageIndex === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-800 hover:text-white'}`;
            prevBtn.innerHTML = `<i class="fas fa-chevron-left text-xs"></i>`;
            prevBtn.onclick = () => { if (currentPageIndex > 0) fetchVideosForPage(currentPageIndex - 1); };
            container.appendChild(prevBtn);

            let pagesToShow = [];
            for (let i = 0; i < totalKnownPages; i++) {
                if (
                    i === 0 || 
                    i === totalKnownPages - 1 || 
                    (i >= currentPageIndex - 1 && i <= currentPageIndex + 1)
                ) {
                    pagesToShow.push(i);
                } else if (
                    i === currentPageIndex - 2 || 
                    i === currentPageIndex + 2
                ) {
                    pagesToShow.push('...');
                }
            }
            pagesToShow = pagesToShow.filter((val, idx, arr) => val !== '...' || arr[idx - 1] !== '...');

            pagesToShow.forEach(p => {
                if (p === '...') {
                    const dots = document.createElement('span');
                    dots.className = 'w-10 h-10 flex items-center justify-center text-slate-500 font-bold';
                    dots.innerText = '...';
                    container.appendChild(dots);
                } else {
                    const pageNum = p;
                    const btn = document.createElement('button');
                    const isActive = pageNum === currentPageIndex;
                    btn.className = `w-10 h-10 rounded-xl border flex items-center justify-center font-medium transition-all ${
                        isActive 
                            ? 'bg-slate-100 border-slate-100 text-slate-950 font-bold shadow-md' 
                            : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`;
                    btn.innerText = pageNum + 1;
                    btn.onclick = () => fetchVideosForPage(pageNum);
                    container.appendChild(btn);
                }
            });

            const nextBtn = document.createElement('button');
            nextBtn.className = `w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-center transition-all ${!hasMorePages && currentPageIndex === pageTokens.length - 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-800 hover:text-white'}`;
            nextBtn.innerHTML = `<i class="fas fa-chevron-right text-xs"></i>`;
            nextBtn.onclick = () => {
                if (currentPageIndex < pageTokens.length - 1 || hasMorePages) {
                    fetchVideosForPage(currentPageIndex + 1);
                }
            };
            container.appendChild(nextBtn);
        }

        function renderVideos(items) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            items.forEach(video => {
                const snippet = video.snippet;
                const stats = video.statistics || {};
                const durationRaw = video.contentDetails ? video.contentDetails.duration : '';

                const title = snippet.title;
                const description = snippet.description || '';
                const thumbnail = snippet.thumbnails.maxres?.url || snippet.thumbnails.high?.url || snippet.thumbnails.medium?.url;
                
                const pubDate = new Date(snippet.publishedAt).toLocaleDateString('de-DE', {
                    day: '2-digit', month: '2-digit', year: 'numeric'
                });

                const durationFormatted = durationRaw ? parseISO8601Duration(durationRaw) : 'HD';

                const views = stats.viewCount ? parseInt(stats.viewCount).toLocaleString('de-DE') : '0';
                const likes = stats.likeCount ? parseInt(stats.likeCount).toLocaleString('de-DE') : '0';
                const comments = stats.commentCount ? parseInt(stats.commentCount).toLocaleString('de-DE') : '0';

                const card = document.createElement('div');
                card.className = 'group flex flex-col bg-slate-900/90 border border-slate-800/80 hover:border-purple-500/50 rounded-xl overflow-hidden transition-all duration-300 cursor-pointer hover:shadow-xl hover:shadow-purple-900/20';
                card.onclick = () => openModal(video.id);

                card.innerHTML = `
                    <div class="relative aspect-video bg-slate-950 overflow-hidden">
                        <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <div class="w-12 h-12 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center text-slate-950 shadow-lg transform scale-90 group-hover:scale-100 transition-transform">
                                <i class="fas fa-play ml-0.5 text-lg"></i>
                            </div>
                        </div>
                        <span class="absolute bottom-2.5 right-2.5 bg-black/80 text-white font-mono text-xs px-2 py-0.5 rounded font-semibold tracking-wide">
                            ${durationFormatted}
                        </span>
                    </div>

                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-semibold text-white text-base group-hover:text-purple-300 transition-colors line-clamp-2 leading-snug mb-1">
                                ${title}
                            </h3>
                            <p class="text-xs text-slate-400 mb-2">${pubDate}</p>
                            <p class="text-xs text-slate-400 line-clamp-1 mb-3 font-normal">${description}</p>
                        </div>

                        <div class="pt-3 border-t border-slate-800/80 flex items-center gap-3 text-xs text-slate-400 font-medium">
                            <span>${views} Aufrufe</span>
                            <span>•</span>
                            <span>${likes} Likes</span>
                            <span>•</span>
                            <span>${comments} Kommentare</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function parseISO8601Duration(isoDuration) {
            const regex = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/;
            const matches = isoDuration.match(regex);
            if (!matches) return "HD";

            const hours = parseInt(matches[1] || 0);
            const minutes = parseInt(matches[2] || 0);
            const seconds = parseInt(matches[3] || 0);

            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else {
                return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
        }

        function openModal(videoId) {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = '';
            modal.classList.add('hidden');
        }

        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') closeModal();
        });

        // Direkt starten
        fetchVideosForPage(0);
    </script>
</body>
</html>
